services:
  console:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEVICE_TOKEN: ${DEVICE_TOKEN:?Set DEVICE_TOKEN in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - armor-data:/app/instance
volumes:
  armor-data:
