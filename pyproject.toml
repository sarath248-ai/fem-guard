[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "her-techarmor"
version = "0.1.0"
description = "Human-reviewed safety operations prototype"
requires-python = ">=3.11"
dependencies = ["Flask==3.1.2", "waitress==3.0.2"]
[tool.setuptools.package-data]
techarmor = ["templates/*.html", "static/*.css", "static/*.js"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
